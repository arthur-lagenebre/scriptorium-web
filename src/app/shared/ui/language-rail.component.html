<nav class="rail" [attr.aria-label]="label()">
  <ul role="tablist" aria-orientation="vertical">
    @for (entry of entries(); track entry.code; let i = $index) {
    @if (i === firstTodo()) {
    <li role="presentation" class="group">À traduire</li>
    }
    <li role="none">
      <button #entry role="tab" [id]="'lang-' + entry.code" [attr.aria-selected]="entry.code === selected()" [attr.aria-label]="entry.translated ? entry.name : entry.name + ', non traduit'" [tabindex]="entry.code === selected() ? 0 : -1" [class.is-selected]="entry.code === selected()" [class.is-empty]="!entry.translated" (click)="selected.set(entry.code)" (keydown)="onKeydown($event, i)">
        <span class="name" [attr.lang]="entry.code">{{ entry.name }}</span>
        <span class="code" aria-hidden="true">({{ entry.code }})</span>
      </button>
    </li>
    }
  </ul>
</nav>
