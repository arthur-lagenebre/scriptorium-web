<div>
  <div class="flex-container">
    <div *ngFor='let card of cards' class="flex-child">
      <a [routerLink]="['/details', card.Id]">
        <img class="card-image" title="{{GetCardName(card)}}" alt="{{GetCardName(card)}}" src="{{GetImageUrl(card.Sets)}}">
      </a>
    </div>
  </div>
</div>
<div *ngIf='errorMessage' class='alert alert-danger'>
  Error: {{ errorMessage }}
</div>
